name: Generate Tool Specifications

# Verify-only: regenerates lib/shards-ai-agents-tools/tool.specs.json and fails if it is
# out of date. (The upstream version pushed an auto-commit using a GitHub App; that needs
# secrets this repo does not have.) To fix a failure, run
#   cd lib/shards-ai-agents-tools && uv run python src/shards_ai_agents_tools/generate_tool_specs.py
# and commit the result.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/shards-ai-agents-tools/src/shards_ai_agents_tools/**'
      - 'lib/shards-ai-agents-tools/tool.specs.json'
      - '.github/workflows/generate-tool-specs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-specs:
    name: Verify tool specs are up to date
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true

      - name: Install the project
        working-directory: lib/shards-ai-agents-tools
        run: uv sync --dev --all-extras

      - name: Generate tool specifications
        working-directory: lib/shards-ai-agents-tools
        run: uv run python src/shards_ai_agents_tools/generate_tool_specs.py

      - name: Verify tool.specs.json is up to date
        run: |
          if git diff --quiet -- lib/shards-ai-agents-tools/tool.specs.json; then
            echo "tool.specs.json is up to date"
          else
            echo "::error::tool.specs.json is out of date. Regenerate it and commit the result."
            git diff --stat -- lib/shards-ai-agents-tools/tool.specs.json
            exit 1
          fi
