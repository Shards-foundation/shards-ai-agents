[project]
name = "shards-ai-agents-files"
dynamic = ["version"]
description = "File handling utilities for Shards-ai-agents multimodal inputs"
readme = "README.md"
authors = [
    { name = "Greyson LaLonde", email = "greyson@shards-ai-agents.invalid" }
]
requires-python = ">=3.10, <3.14"
dependencies = [
    "Pillow>=12.3.0,<13; python_version < '3.11'",
    "Pillow>=13.0.0; python_version >= '3.11'",
    "pypdf>=6.21.2,<7",
    "python-magic>=0.4.27",
    "aiocache~=0.12.3",
    "aiofiles~=24.1.0",
    "tinytag>=2.3.0,<3",
    "av~=13.0.0",
]

[tool.uv]
exclude-newer = "3 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/shards_ai_agents_files/__init__.py"
