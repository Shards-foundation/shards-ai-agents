[project]
name = "{{folder_name}}"
version = "0.1.0"
description = "{{name}} using Shards-ai-agents"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "{{shards_ai_agents_tools_dependency}}"
]

[project.scripts]
kickoff = "{{folder_name}}.main:kickoff"
run_crew = "{{folder_name}}.main:kickoff"
plot = "{{folder_name}}.main:plot"
run_with_trigger = "{{folder_name}}.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.shards_ai_agents]
type = "flow"
