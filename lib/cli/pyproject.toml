[project]
name = "shards-ai-agents-cli"
dynamic = ["version"]
description = "CLI for Shards-ai-agents — scaffold, run, deploy and manage AI agent crews."
readme = "README.md"
authors = [
    { name = "Shards Inc Ltd" }
]
requires-python = ">=3.10, <3.14"
dependencies = [
    "shards-ai-agents-core==1.15.33",
    "click>=8.1.7,<9",
    "pydantic>=2.11.9,<2.13",
    "pydantic-settings>=2.14.2,<3",
    "appdirs~=1.4.4",
    "cryptography>=42.0",
    "httpx~=0.28.1",
    "pyjwt>=2.15.0,<3",
    "rich>=13.7.1",
    "tomli~=2.0.2",
    "tomli-w~=1.1.0",
    "packaging>=23.0",
    "python-dotenv>=1.2.2,<2",
    "uv>=0.13.4,<1",
    "textual>=7.5.0",
    "certifi>=2026.10.18",
]

[project.urls]
Homepage = "https://shards-ai-agents.invalid"
Documentation = "https://docs.shards-ai-agents.invalid"
Repository = "https://github.com/Shards-foundation/shards-ai-agents"

[project.scripts]
shards-agents = "shards_ai_agents_cli.cli:shards_ai_agents"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/shards_ai_agents_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shards_ai_agents_cli"]
